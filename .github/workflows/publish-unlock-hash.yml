name: Publish unlock hash

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Write password hash
        env:
          BIRTHDAYPASSWORD: ${{ secrets.BIRTHDAYPASSWORD }}
        run: |
          if [ -z "$BIRTHDAYPASSWORD" ]; then
            echo "BIRTHDAYPASSWORD secret is missing"
            exit 1
          fi
          hash=$(printf '%s' "$BIRTHDAYPASSWORD" | sha256sum | awk '{print $1}')
          printf '{"sha256":"%s"}\n' "$hash" > password.json

      - name: Commit hash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add password.json
          if git diff --cached --quiet; then
            echo "Hash unchanged"
          else
            git commit -m "Publish unlock hash"
            git push origin HEAD:gh-pages
          fi
